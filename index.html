<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>情報集約サイト</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;

  background:
    linear-gradient(
      135deg,
      #4facfe,
      #00f2fe
    );

  min-height:100vh;

  color:white;

  padding:20px;
}

body.dark{

  background:
    linear-gradient(
      135deg,
      #141e30,
      #243b55
    );
}

.container{
  max-width:1300px;
  margin:auto;
}
  
h1{
  text-align:center;
  font-size:48px;
  margin-bottom:20px;

  text-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:30px;
}

.glass{

  background:rgba(255,255,255,0.15);

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.2);

  border-radius:20px;

  box-shadow:
    0 8px 32px rgba(0,0,0,0.2);
}

#clock{
  padding:15px 25px;
  font-size:20px;
  font-weight:bold;
}

button{

  border:none;
  padding:12px 20px;

  border-radius:12px;

  cursor:pointer;

  transition:0.3s;

  font-weight:bold;

  background:white;
  color:#333;
}

button:hover{

  transform:translateY(-3px);

  box-shadow:
    0 5px 15px rgba(0,0,0,0.3);
}

.search-area{

  padding:30px;

  margin-bottom:30px;
}

.search-group{

  display:flex;
  gap:10px;

  flex-wrap:wrap;

  margin-bottom:20px;
}

input{

  flex:1;

  min-width:200px;

  padding:14px;

  border:none;

  border-radius:12px;

  outline:none;

  font-size:16px;
}

.section-title{

  margin:25px 0 15px;

  font-size:28px;
}

#weather-container{

  padding:30px;

  text-align:center;

  margin-bottom:30px;
}

.weather-temp{

  font-size:50px;

  font-weight:bold;

  margin:10px 0;
}

.category-buttons{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-bottom:20px;
}

#news-container{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

  gap:25px;
}

.news-card{

  overflow:hidden;

  transition:0.3s;

  animation:fadeIn 0.5s ease;
}

.news-card:hover{

  transform:
    translateY(-8px)
    scale(1.02);
}

.news-card img{

  width:100%;

  height:220px;

  object-fit:cover;
}

.news-content{

  padding:20px;
}

.news-content h2{

  font-size:20px;

  margin-bottom:10px;
}

.news-content p{

  line-height:1.6;

  margin-bottom:15px;
}

.news-content a{

  text-decoration:none;

  color:#00e5ff;

  font-weight:bold;
}

.loading{

  text-align:center;

  font-size:22px;

  padding:40px;
}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:768px){

  h1{
    font-size:36px;
  }

  .top-bar{
    flex-direction:column;
    gap:15px;
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="top-bar">

    <div id="clock" class="glass"></div>

    <button onclick="toggleDarkMode()">
      🌙 ダークモード
    </button>

  </div>

  <h1>🌎 情報集約サイト Pro</h1>

  <div class="search-area glass">

    <div class="search-group">

      <input
        type="text"
        id="city-input"
        placeholder="都市名を入力">

      <button onclick="searchCity()">
        天気検索
      </button>

    </div>

    <div class="search-group">

      <input
        type="text"
        id="news-input"
        placeholder="ニュース検索">

      <button onclick="searchNews()">
        ニュース検索
      </button>

    </div>

    <button onclick="getCurrentLocation()">
      📍 現在地取得
    </button>

  </div>

  <h2 class="section-title">
    ☀️ 天気情報
  </h2>

  <div id="weather-container" class="glass">
    読み込み中...
  </div>

  <h2 class="section-title">
    📰 最新ニュース
  </h2>

  <div class="category-buttons">

    <button onclick="loadNews('technology')">
      IT
    </button>

    <button onclick="loadNews('sports')">
      スポーツ
    </button>

    <button onclick="loadNews('business')">
      経済
    </button>

    <button onclick="loadNews('gaming')">
      ゲーム
    </button>

  </div>

  <div id="news-container"></div>

</div>

<script>

//////////////////////////////
// APIキー
//////////////////////////////

const NEWS_API_KEY = "62d1df407fb7864d1fdf936edfa395d8";
const WEATHER_API_KEY = "e05fd00b2e7f6e146907daf57982d294";


//////////////////////////////
// 都市変換
//////////////////////////////

const cityMap = {

  // 北海道・東北
  "北海道":"Sapporo",
  "札幌":"Sapporo",

  "青森":"Aomori",
  "青森県":"Aomori",
  "青森市":"Aomori",

  "岩手":"Morioka",
  "岩手県":"Morioka",
  "盛岡":"Morioka",

  "宮城":"Sendai",
  "宮城県":"Sendai",
  "仙台":"Sendai",

  "秋田":"Akita",
  "秋田県":"Akita",
  "秋田市":"Akita",

  "山形":"Yamagata",

  "山形市":"Yamagata",

  "福島":"Fukushima",

  "茨城県":"Mito",

  "宇都宮":"Utsunomiya",

  "群馬":"Maebashi",
  "群馬県":"Maebashi",
  "前橋":"Maebashi",

  "埼玉":"Saitama",
  "埼玉県":"Saitama",
  "さいたま":"Saitama",

  "千葉":"Chiba",
  "千葉県":"Chiba",
  "千葉市":"Chiba",

  "東京":"Tokyo",
  "東京都":"Tokyo",

  "神奈川":"Yokohama",
  "神奈川県":"Yokohama",
  "横浜":"Yokohama",

  // 中部
  "新潟":"Niigata",
  "新潟県":"Niigata",
  "新潟市":"Niigata",

  "富山":"Toyama",
  "富山県":"Toyama",
  "富山市":"Toyama",

  "石川":"Kanazawa",
  "石川県":"Kanazawa",
  "金沢":"Kanazawa",

  "福井":"Fukui",
  "福井県":"Fukui",
  "福井市":"Fukui",

  "山梨":"Kofu",
  "山梨県":"Kofu",
  "甲府":"Kofu",

  "長野":"Nagano",
  "長野県":"Nagano",
  "長野市":"Nagano",

  "岐阜":"Gifu",
  "岐阜県":"Gifu",
  "岐阜市":"Gifu",

  "静岡":"Shizuoka",
  "静岡県":"Shizuoka",
  "静岡市":"Shizuoka",

  "愛知":"Nagoya",
  "愛知県":"Nagoya",
  "名古屋":"Nagoya",

  // 近畿
  "三重":"Tsu",
  "三重県":"Tsu",
  "津":"Tsu",

  "滋賀":"Otsu",
  "滋賀県":"Otsu",
  "大津":"Otsu",

  "京都":"Kyoto",
  "京都府":"Kyoto",

  "大阪":"Osaka",
  "大阪府":"Osaka",

  "兵庫":"Kobe",
  "兵庫県":"Kobe",
  "神戸":"Kobe",

  "奈良":"Nara",
  "奈良県":"Nara",

  "和歌山":"Wakayama",
  "和歌山県":"Wakayama",

  // 中国
  "鳥取":"Tottori",
  "鳥取県":"Tottori",

  "島根":"Matsue",
  "島根県":"Matsue",
  "松江":"Matsue",

  "岡山":"Okayama",
  "岡山県":"Okayama",

  "広島":"Hiroshima",
  "広島県":"Hiroshima",

  "山口":"Yamaguchi",
  "山口県":"Yamaguchi",

  // 四国
  "徳島":"Tokushima",
  "徳島県":"Tokushima",

  "香川":"Takamatsu",
  "香川県":"Takamatsu",
  "高松":"Takamatsu",

  "愛媛":"Matsuyama",
  "愛媛県":"Matsuyama",
  "松山":"Matsuyama",

  "高知":"Kochi",
  "高知県":"Kochi",

  // 九州・沖縄
  "福岡":"Fukuoka",

  "佐賀":"Saga",
  "佐賀県":"Saga",

  "長崎":"Nagasaki",
  "長崎県":"Nagasaki",

  "熊本":"Kumamoto",
  "熊本県":"Kumamoto",

  "大分":"Oita",
  "大分県":"Oita",

  "宮崎":"Miyazaki",
  "宮崎県":"Miyazaki",

  "鹿児島":"Kagoshima",
  "鹿児島県":"Kagoshima",

  "沖縄":"Naha",
  "沖縄県":"Naha",
  "那覇":"Naha"
};
//////////////////////////////
// 時計
//////////////////////////////

function updateClock(){

  const now = new Date();

  document
    .getElementById("clock")
    .innerText =
      now.toLocaleString("ja-JP");
}

setInterval(updateClock,1000);

updateClock();

//////////////////////////////
// ダークモード
//////////////////////////////

function toggleDarkMode(){

  document.body
    .classList
    .toggle("dark");
}

//////////////////////////////
// 天気取得
//////////////////////////////

function getWeather(city){

  const url =
`https://api.openweathermap.org/data/2.5/weather?q=${city},JP&appid=${WEATHER_API_KEY}&lang=ja&units=metric`;

  fetch(url)

    .then(res => res.json())

    .then(data => {

      const weather =
        document.getElementById("weather-container");

      weather.innerHTML = `

        <h2>${data.name}</h2>

        <div class="weather-temp">
          ${Math.round(data.main.temp)}℃
        </div>

        <p>
          ${data.weather[0].description}
        </p>

        <p>
          湿度: ${data.main.humidity}%
        </p>

      `;
    });
}

//////////////////////////////
// 現在地取得
//////////////////////////////

function getCurrentLocation(){

  navigator.geolocation.getCurrentPosition(

    pos => {

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      const url =
`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${WEATHER_API_KEY}&lang=ja&units=metric`;

      fetch(url)

        .then(res => res.json())

        .then(data => {

          const weather =
            document.getElementById("weather-container");

          weather.innerHTML = `

            <h2>${data.name}</h2>

            <div class="weather-temp">
              ${Math.round(data.main.temp)}℃
            </div>

            <p>
              ${data.weather[0].description}
            </p>

            <p>
              湿度: ${data.main.humidity}%
            </p>

          `;
        });

      loadNews("technology");
    }
  );
}

//////////////////////////////
// 天気検索
//////////////////////////////

function searchCity(){

  let city =
    document
      .getElementById("city-input")
      .value
      .trim();

  if(!city) return;

  city = cityMap[city] || city;

  getWeather(city);
}

//////////////////////////////
// Enter検索
//////////////////////////////

document
  .getElementById("city-input")
  .addEventListener("keydown",e=>{

    if(e.key==="Enter"){
      searchCity();
    }
});

document
  .getElementById("news-input")
  .addEventListener("keydown",e=>{

    if(e.key==="Enter"){
      searchNews();
    }
});

//////////////////////////////
// ニュース取得
//////////////////////////////

function loadNews(keyword){

  const container =
    document.getElementById("news-container");

  container.innerHTML =
    `<div class="loading">読み込み中...</div>`;

  const url =
`https://gnews.io/api/v4/search?q=${encodeURIComponent(keyword)}&lang=ja&country=jp&max=9&apikey=${NEWS_API_KEY}`;

  fetch(url)

    .then(res => res.json())

    .then(data => {

      container.innerHTML = "";

      if(!data.articles || data.articles.length === 0){

        container.innerHTML =
          `<div class="loading">ニュースが見つかりません</div>`;

        return;
      }

      data.articles.forEach(article => {

        const card =
          document.createElement("div");

        card.className =
          "news-card glass";

        card.innerHTML = `

          ${
            article.image
            ? `<img src="${article.image}" alt="ニュース画像">`
            : ""
          }

          <div class="news-content">

            <h2>
              ${article.title}
            </h2>

            <p>
              ${article.description || ""}
            </p>

            <a
              href="${article.url}"
              target="_blank">

              記事を見る →

            </a>

          </div>

        `;

        container.appendChild(card);

      });

    })

    .catch(error => {

      console.error(error);

      container.innerHTML =
        `<div class="loading">ニュース取得失敗</div>`;

    });

}

//////////////////////////////
// ニュース検索
//////////////////////////////

function searchNews(){

  const keyword =
    document
      .getElementById("news-input")
      .value
      .trim();

  if(keyword){
    loadNews(keyword);
  }
}

//////////////////////////////
// 初期表示
//////////////////////////////

getCurrentLocation();

</script>

</body>
</html>
